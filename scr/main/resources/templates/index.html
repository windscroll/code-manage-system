<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <title>代码题库文档管理系统</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@3.3.7/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        html,body{height:100%;margin:0;padding:0;}
        .left-tree{width:280px;height:100%;background:#f5f5f5;float:left;border-right:1px solid #ccc;}
        .right-content{margin-left:280px;height:100%;padding:20px;}
        .tree-item{padding:4px 10px;cursor:pointer;}
        .tree-item:hover{background:#e8e8e8;}
        .right-menu{position:fixed;width:160px;background:#fff;border:1px solid #ccc;display:none;z-index:999;}
        .right-menu li{list-style:none;padding:8px 12px;cursor:pointer;}
        .right-menu li:hover{background:#409eff;color:#fff;}
        .login-box{padding:15px;border-bottom:1px solid #ccc;}
    </style>
</head>
<body>
<div class="login-box">
    <span id="roleText">当前身份：游客浏览模式</span>
    <button class="btn btn-sm btn-primary" id="loginBtn">管理员登录</button>
</div>
<div class="left-tree" id="treeBox"></div>
<div class="right-content" id="contentBox">
    <h3>请点击左侧目录进行查看</h3>
</div>

<ul class="right-menu" id="rightMenu">
    <li onclick="addFolder()">新建文件夹</li>
    <li onclick="addQuestionDoc()">新建题目文档</li>
    <li onclick="renameNode()">重命名</li>
    <li onclick="deleteNode()">删除</li>
</ul>

<script src="https://cdn.jsdelivr.net/npm/jquery@3.6.4/dist/jquery.min.js"></script>
<script>
    let nowNodeId = 0;
    let nowNodeType = 0;
    let isAdmin = false;

    //初始化判断管理员权限
    function checkAdmin(){
        $.get("/api/isAdmin",function(res){
            isAdmin = res;
            if(isAdmin){
                $("#roleText").text("当前身份：管理员权限");
                $("#loginBtn").hide();
            }
        })
    }

    //管理员登录弹窗
    $("#loginBtn").click(function(){
        let username = prompt("请输入管理员账号");
        let password = prompt("请输入登录密码");
        if(!username || !password) return;
        $.post("/api/login",{username:username,password:password},function(res){
            if(res){
                alert("登录成功，已解锁全部管理权限");
                window.location.reload();
            }else{
                alert("账号密码错误");
            }
        })
    })

    function loadTree(){
        $.get("/api/tree/list",function(res){
            let html = renderTree(res);
            $("#treeBox").html(html);
        })
    }

    function renderTree(data){
        let html = "";
        data.forEach(item=>{
            let icon = item.nodeType === 1 ? "📁" : "📄";
            html += `<div class="tree-item" data-id="${item.id}" data-type="${item.nodeType}" onclick="clickNode(${item.id},${item.nodeType})">
                        ${icon} ${item.nodeName}
                     </div>`;
            if(item.children && item.children.length>0){
                html += '<div style="margin-left:15px">'+renderTree(item.children)+'</div>'
            }
        })
        return html;
    }

    function clickNode(id,type){
        nowNodeId = id;
        nowNodeType = type;
        if(type === 2){
            loadQuestionContent(id);
        }else{
            $("#contentBox").html("<h4>当前为文件夹目录，管理员可右键进行管理操作</h4>");
        }
    }

    //仅管理员生效右键菜单
    $(document).contextmenu(function(e){
        if(!isAdmin){
            return true;
        }
        $("#rightMenu").css({left:e.pageX,top:e.pageY}).show();
        return false;
    })

    $(document).click(function(){
        $("#rightMenu").hide();
    })

    function addFolder(){
        if(!isAdmin) return;
        let name = prompt("请输入文件夹名称");
        if(!name) return;
        $.post("/api/tree/add",{parentId:nowNodeId,nodeType:1,nodeName:name},function(){
            loadTree();
        })
    }

    function addQuestionDoc(){
        if(!isAdmin) return;
        let name = prompt("请输入题目文档名称");
        if(!name) return;
        $.post("/api/tree/add",{parentId:nowNodeId,nodeType:2,nodeName:name},function(){
            loadTree();
        })
    }

    function renameNode(){
        if(!isAdmin) return;
        let name = prompt("输入新名称");
        if(!name) return;
        $.post("/api/tree/edit",{id:nowNodeId,nodeName:name},function(){
            loadTree();
        })
    }

    function deleteNode(){
        if(!isAdmin) return;
        if(!confirm("确认删除？将会清空所有子数据")) return;
        $.get("/api/tree/delete?id="+nowNodeId,function(){
            loadTree();
            $("#contentBox").html("<h3>请点击左侧目录进行查看</h3>");
        })
    }

    function loadQuestionContent(nodeId){
        $.get("/api/solution/list?nodeId="+nodeId,function(res){
            let html = `<h3>题目文档内容</h3><hr>`;
            if(isAdmin){
                html += `<button class="btn btn-primary" onclick="addSolution(${nodeId})">添加新解法</button><br><br>`;
            }
            res.forEach(item=>{
                html += `
                <div class="panel panel-default">
                    <div class="panel-heading">
                        <span>方法${item.solveSort}</span>
                        <span class="label label-info">${item.langTag}</span>
                        ${isAdmin?'<button onclick="delSolution('+item.id+')" class="btn btn-xs btn-danger pull-right">删除</button>':''}
                    </div>
                    <div class="panel-body">
                        <p><b>解法描述：</b>${item.solutionDesc}</p>
                        <pre>${item.codeContent}</pre>
                        ${isAdmin?'<button class="btn btn-sm btn-success" onclick="editSolution('+item.id+')">编辑内容</button>':''}
                    </div>
                </div>
                `
            })
            $("#contentBox").html(html);
        })
    }

    function addSolution(nodeId){
        let sort = prompt("请填写方法序号(1/2/3)");
        let lang = prompt("自定义填写编程语言标签");
        let desc = prompt("填写解法描述以及解题思路");
        let code = prompt("粘贴对应源代码");
        $.post("/api/solution/save",{
            nodeId:nodeId,
            solveSort:sort,
            langTag:lang,
            solutionDesc:desc,
            codeContent:code
        },function(){
            loadQuestionContent(nodeId);
        })
    }

    function delSolution(id){
        $.get("/api/solution/delete?id="+id,function(){
            loadQuestionContent(nowNodeId);
        })
    }

    $(function(){
        checkAdmin();
        loadTree();
    })
</script>
</body>
</html>
